name: Build + Release

on:
    push:
        branches: [main]
    workflow_dispatch:

permissions:
    contents: write
    packages: write

env:
    CARGO_TERM_COLOR: always

jobs:
    build:
        runs-on: ${{ matrix.os }}
        strategy:
            matrix:
                os: [ubuntu-latest, windows-latest]
        outputs:
            artifact-name: ${{ steps.upload.outputs.artifact-name }}

        steps:
            - name: Checkout repo
              uses: actions/checkout@v5

            - name: Install Rust
              uses: dtolnay/rust-toolchain@stable

            - name: Install system deps
              if: runner.os == 'Linux'
              run: |
                  sudo apt-get update
                  sudo apt-get install -y build-essential libdrm-dev libdrm-amdgpu1 pkg-config

            - name: Cache dependencies
              uses: actions/cache@v5
              with:
                  path: |
                      ~/.cargo/registry
                      ~/.cargo/git
                      target
                  key: ${{ runner.os }}-cargo-release-${{ hashFiles('**/Cargo.lock') }}

            - name: Build
              run: |
                  cargo build --release
              shell: bash

            - name: Upload artifact
              id: upload
              uses: actions/upload-artifact@v7
              with:
                  name: release-${{ matrix.os }}
                  path: |
                      target/release/slim-osc*
                      target/release/slim-osc*.exe

    release:
        needs: build
        if: startsWith(github.ref, 'refs/tags/') && needs.build.result == 'success'
        runs-on: ubuntu-latest
        steps:
            - name: Download build artifacts from this run
              uses: actions/download-artifact@v5
              with:
                  # download all artifacts uploaded in the same workflow run
                  path: release_assets

            - name: Create release and upload assets
              uses: softprops/action-gh-release@v1
              with:
                  tag_name: ${{ github.ref_name }}
                  name: ${{ github.ref_name }}
                  body: Automated release for ${{ github.ref_name }}
                  files: release_assets/**/*
              env:
                  GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
