[package]
name = "slim-osc"
description = "incredibly thin program for displaying pc stats in a vrchat message"
version = "1.0.0"
edition = "2024"

[profile.release]
strip = true
lto = "fat"
panic = "abort"
codegen-units = 1

[dependencies]
anyhow = "1.0.102"
cached = "1.1.0"
chrono = "0.4.44"
chumsky = "0.13.0"
clap = { version = "4.6.0", features = ["derive", "string"] }
gfxinfo = { version = "0.1.2", features = ["gpu_info"] }
notify = "8.2.0"
notify-debouncer-full = "0.7.0"
rosc = "0.11.4"
serde = { version = "1.0.228", features = ["rc", "serde_derive"] }
sysinfo = "0.38.4"
tokio = { version = "1.51.1", features = ["rt-multi-thread", "net", "macros", "time", "process", "sync", "io-util"] }
tokio-util = "0.7.18"
toml = "1.1.2"
tracing = "0.1.44"
tracing-subscriber = "0.3.23"

[target.'cfg(windows)'.dependencies]
windows = { version = "0.62.2", features = ["Media", "Media_Control"] }
